# Builds the site and deploys it to Firebase Hosting whenever main changes,
# whether by a direct push or a merged pull request. Pushes to any other
# branch do not run it.
name: Deploy

on:
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab, to redeploy main by hand.
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running deploy to finish
# instead of cancelling it halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    # Manual runs are allowed from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://deya-bg.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Typecheck, lint and production build. Any failure stops the deploy.
      - run: npm run check

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEYA_THERAPY_2 }}
          projectId: deya-therapy-2
          channelId: live
